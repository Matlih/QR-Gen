[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qr_gen"
version = "0.1.0"
description = "A modern, Python-native QR Code generator with a CustomTkinter GUI."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "qrcode[pil]>=7.4.0",
    "Pillow>=10.0.0",
    "customtkinter>=5.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
qr-gen-gui = "qr_gen.gui:main"
qr-gen = "qr_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
